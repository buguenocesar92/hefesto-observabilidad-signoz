# =============================================================================
# SigNoz — despliegue de un solo nodo para Pyme
#
# ⚠️  ARCHIVO REVISADO POR HEFESTO — NO SOPORTADO POR UPSTREAM
# -----------------------------------------------------------------------------
# Desde la v0.130.0 de SigNoz, la vía SOPORTADA es Foundry (`foundryctl`), que
# genera sus manifiestos desde un `casting.yaml`. Ver `casting.yaml` en este kit.
#
# Este compose NO es un compose inventado: es una copia revisada a mano del
# artefacto que produce Foundry, con tres cambios deliberados:
#   1. Versiones fijadas (upstream genera `latest` para signoz y el colector).
#   2. Rutas de configuración dentro de `config/` en vez de `pours/`.
#   3. Sin puertos publicados (Coolify/Traefik llega a la UI por la red Docker; para uso local está compose.local.yaml) y dependencias de arranque explícitas.
#
# Cuándo conviene usar ESTE archivo en vez de `foundryctl`:
#   - Coolify (el recurso "Docker Compose" no ejecuta foundryctl).
#   - Un VPS donde no quieres instalar el binario foundryctl.
#   - Un entorno donde el compose debe quedar como artefacto auditable y
#     versionado en git tal cual.
#
# Cuándo conviene usar Foundry:
#   - Quieres exactamente lo que upstream considera soportado.
#   - Vas a cambiar de ClickHouse externo, Coolify nativo u otra plataforma:
#     el casting.yaml ya tiene `platform: coolify` y `deployment.flavor: stack`.
#   - Quieres regenerar la config cuando actualizas de versión.
#
# Fuente del compose base:
#   https://github.com/SigNoz/foundry/blob/main/docs/examples/docker/compose/pours/deployment/compose.yaml
# Documentación de instalación:
#   https://signoz.io/docs/install/docker/
#
# REQUISITOS (verificados en la doc oficial):
#   - Linux o macOS. En Windows: WSL2 con Docker nativo.
#   - Docker Engine 20.10+ con Compose v2.
#   - Mínimo 4 GB de RAM.
#
# PUERTOS PUBLICADOS: ninguno. Coolify enruta el dominio a signoz-signoz-0:8080
# por la red Docker. Para uso local sin Coolify, añade compose.local.yaml
# (publica 8080 y OTLP en 127.0.0.1). Lee 08-SERVICIOS-COMERCIALES.md antes de exponer OTLP.
# ClickHouse (9000/8123), Keeper (9181), Postgres (5432) y OpAMP (4320) NUNCA
# se publican: viven solo en la red Docker interna.
# =============================================================================

networks:
  signoz-network: {}

services:
  # ---------------------------------------------------------------------------
  # Metastore — PostgreSQL: organizaciones, usuarios, tableros, reglas de alerta.
  # Es lo ÚNICO que de verdad no se puede regenerar. Respaldalo siempre.
  # ---------------------------------------------------------------------------
  signoz-metastore-postgres-0:
    # `postgres:16` es una etiqueta de major flotante, que es lo que resuelve
    # Foundry por defecto. No se fijó a digest porque no verifiqué el digest de
    # esta imagen (queda anotado en docs/07-PRUEBAS-DE-ACEPTACION.md).
    # Si necesitas reproducibilidad total, fija el digest con
    #   docker pull postgres:16 && docker inspect --format '{{index .RepoDigests 0}}' postgres:16
    # y reemplaza la etiqueta.
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: signoz
      POSTGRES_USER: signoz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    # Healthcheck tomado del artefacto de Foundry (upstream).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signoz -d signoz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - signoz-metastore-postgres-0-data:/var/lib/postgresql/data
    networks:
      - signoz-network

  # ---------------------------------------------------------------------------
  # Job único: aplica las migraciones de esquema en ClickHouse al arrancar.
  # Corre, termina y queda como exited 0. `on-failure` (no `unless-stopped`)
  # porque es un job, no un servicio de larga duración.
  # ---------------------------------------------------------------------------
  signoz-telemetrystore-migrator:
    image: signoz/signoz-otel-collector:v0.144.14
    restart: on-failure
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate ready &&
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    depends_on:
      signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    networks:
      - signoz-network

  # ---------------------------------------------------------------------------
  # Descarga el binario histogram-quantile que ClickHouse usa para calcular
  # histogramas en las alertas. Tarda en salir: no es un fallo de arranque.
  # ---------------------------------------------------------------------------
  signoz-telemetrystore-clickhouse-user-scripts:
    image: clickhouse/clickhouse-server:25.12.5
    restart: on-failure
    command:
      - bash
      - -c
      - |-
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts
    networks:
      - signoz-network

  # ---------------------------------------------------------------------------
  # ClickHouse Keeper — coordinación del clúster ClickHouse.
  # ---------------------------------------------------------------------------
  signoz-telemetrykeeper-clickhousekeeper-0:
    image: clickhouse/clickhouse-keeper:25.12.5
    restart: unless-stopped
    entrypoint: ["/usr/bin/clickhouse-keeper", "--config-file=/etc/clickhouse-keeper/keeper.yaml"]
    # Healthcheck tomado del artefacto de Foundry (upstream).
    healthcheck:
      test: ["CMD", "clickhouse-keeper-client", "-h", "localhost", "-p", "9181", "-q", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
      - ./config/clickhouse-keeper.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
    networks:
      - signoz-network

  # ---------------------------------------------------------------------------
  # ClickHouse — almacén de TODA la telemetría: trazas, métricas y logs.
  # El usuario `default` va SIN contraseña en la config upstream, pero el puerto
  # 9000/8123 no se publica: solo es alcanzable desde la red Docker.
  # No le abras el puerto "por si acaso": eso entrega la telemetría del cliente.
  # ---------------------------------------------------------------------------
  signoz-telemetrystore-clickhouse-0-0:
    image: clickhouse/clickhouse-server:25.12.5
    restart: unless-stopped
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
      CLICKHOUSE_CONFIG: /etc/clickhouse-server/config-0-0.yaml
    # Healthcheck tomado del artefacto de Foundry (upstream).
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
      - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
      - ./config/clickhouse-config.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
      - ./config/clickhouse-functions.yaml:/etc/clickhouse-server/functions.yaml:ro
    networks:
      - signoz-network

  # ---------------------------------------------------------------------------
  # Colector OpenTelemetry — ingesta OTLP y gestión de configuración vía OpAMP.
  #
  # ⚠️  SEGURIDAD: el SigNoz self-hosted NO exige clave de ingesta. Quien
  #     alcance 4317/4318 puede escribir telemetría arbitraria en tu instancia.
  #     Por eso aquí NO se publican: solo son alcanzables por la red Docker
  #     (alias signoz-ingester). Para acceso remoto usa VPN,
  #     WireGuard o un proxy con mTLS. Ver 08-SERVICIOS-COMERCIALES.md.
  #
  # Upstream NO define healthcheck para este servicio: no se inventa uno.
  # Para supervisarlo usa el healthcheck de la app, que consulta al colector.
  # ---------------------------------------------------------------------------
  ingester:
    image: signoz/signoz-otel-collector:v0.144.14
    restart: unless-stopped
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    depends_on:
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    volumes:
      - ./config/ingester.yaml:/etc/otel-collector-config.yaml:ro
      - ./config/opamp.yaml:/etc/opamp-config.yaml:ro
    networks:
      signoz-network:
        aliases:
          - signoz-ingester

  # ---------------------------------------------------------------------------
  # Aplicación SigNoz — UI + API + OpAMP (4320, no publicado).
  # ---------------------------------------------------------------------------
  signoz-signoz-0:
    image: signoz/signoz:v0.146.0
    restart: unless-stopped
    environment:
      - SIGNOZ_SQLSTORE_PROVIDER=postgres
      - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}@signoz-metastore-postgres-0:5432/signoz?sslmode=disable
      - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
      # --- Usuario administrador raíz (disponible desde v0.112.0) ---
      # Se crea en el arranque. Deja esto solo durante el despliegue inicial
      # y quita la contraseña del .env después: ver 04-PRIMERA-CUENTA.
      - SIGNOZ_USER_ROOT_ENABLED=${SIGNOZ_USER_ROOT_ENABLED:-false}
      - SIGNOZ_USER_ROOT_EMAIL=${SIGNOZ_USER_ROOT_EMAIL:-}
      - SIGNOZ_USER_ROOT_PASSWORD=${SIGNOZ_USER_ROOT_PASSWORD:-}
      - SIGNOZ_USER_ROOT_ORG_NAME=${SIGNOZ_USER_ROOT_ORG_NAME:-default}
    # Healthcheck tomado del artefacto de Foundry (upstream).
    # Devuelve {"status":"ok"} cuando la app responde.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    networks:
      - signoz-network

volumes:
  # ── PERSISTENTE Y CRÍTICO: sin esto se pierden usuarios, tableros y alertas.
  signoz-metastore-postgres-0-data: {}
  # ── PERSISTENTE: estado del cuórum de ClickHouse.
  signoz-telemetrykeeper-0-data: {}
  # ── PERSISTENTE: TODA la telemetría (trazas, métricas, logs).
  signoz-telemetrystore-0-0-data: {}
  # ── DESCARTABLE: binario descargado, se regenera solo al arrancar.
  signoz-telemetrystore-user-scripts: {}